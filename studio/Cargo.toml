[package]
name = "studio"
version = "0.1.0"
edition = "2021"
# Four binaries live here, so `cargo run -p studio` needs to be told which
# one is meant. The game is the one you get without asking.
default-run = "studio"
description = "An animation studio built on plotkit. Pure maths in, pictures out."

[dependencies]
# The rendering library, used exactly as any other project would use it.
plotkit = { path = "../plotkit" }
shapes = { path = "../shapes" }
# A window and a keyboard. Nothing else.
minifb = "0.28"

[lib]
name = "studio"
path = "src/lib.rs"

[[bin]]
name = "studio"
path = "src/main.rs"
