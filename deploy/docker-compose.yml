# The studio on the test server.
#
#     docker compose -p ludo -f deploy/docker-compose.yml up -d
#     docker compose -p ludo -f deploy/docker-compose.yml down     # and it is gone
#
# ## Sharing a host with something else
#
# This has its own project name, its own network membership and no volume,
# port or config file belonging to anything else. If the host already runs
# something, add a name beside it rather than taking anything down -- and
# validate the proxy config before reloading, because one that will not parse
# takes down everything it was already serving.
#
# ## Why there is no proxy in here
#
# Whatever already terminates TLS on the host should front this, under a name
# whose certificate it already holds. A proxy of our own could only offer some
# other port, which the edge in front of a typical host does not forward -- so
# nobody outside could reach it, which is the whole point.
#
# ## Why HTTPS is the whole point
#
# A browser will not give a page a microphone unless the page is a secure
# context, and on plain http `getUserMedia` is not refused, it is **absent**.
# The game would be perfectly happy on a bare port; the four people talking to
# each other would not.

services:
  ludo:
    image: ludo:latest
    container_name: ludo-app
    restart: unless-stopped
    # No `ports:`. Nothing outside the docker network can reach the game
    # directly -- the lending Caddy is the only way in, which is also what
    # gives it TLS.
    expose:
      - "8088"
    # The app reads files by name -- `.easel` and `.rec` only, relative, no
    # `..`. The surest guard on that is a working directory with nothing in it
    # but the drawings, a user who owns nothing else, and a root filesystem
    # that cannot be written to at all.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - loop

networks:
  # The proxy's network, already existing. Declared external so nothing here
  # can create, alter or remove it. Set `LUDO_NET` to whatever it is called.
  loop:
    external: true
    name: ${LUDO_NET:-web}
