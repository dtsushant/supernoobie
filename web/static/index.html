<!doctype html>
<meta charset="utf-8">
<!-- Without this a phone lays the page out at about 980 pixels and scales the
     result down, so anything pinned to an edge lands off the screen — which is
     exactly what happened to the microphone button. `viewport-fit=cover` and
     the safe-area insets in the stylesheet keep the controls clear of the
     notch and the home bar. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>studio</title>
<link rel="stylesheet" href="/app.css">
<script>
  // Before a single pixel is painted. A page opened to play should never show
  // the studio furniture, not even for the frame it takes a script at the end
  // of the body to run -- which is exactly how long it used to flash for.
  if (new URLSearchParams(location.search).get('play')) {
    document.documentElement.classList.add('to-play');
  }
</script>

<div id="app">
  <aside id="tree">
    <header id="which">
      <a href="/" title="all the drawings">&larr;</a>
      <span id="shown-file">drawing.easel</span>
    </header>
    <header>
      <span class="name">shapes</span>
      <button id="add-shape" title="add a shape">+</button>
    </header>
    <div id="shapes" class="list"></div>

    <header>
      <span class="name">functions</span>
      <button id="add-row" title="add a function">+</button>
    </header>
    <div id="rows" class="list"></div>

    <div id="says"></div>
  </aside>

  <main>
    <div id="bar">
      <span class="set">
        <button data-nib="0" class="on">quill</button>
        <button data-nib="1">round</button>
        <button data-nib="2">broad</button>
      </span>
      <span class="set">
        <button data-tool="draw" class="on">draw</button>
        <button data-tool="pick">pick</button>
        <button data-tool="rub">rub out</button>
      </span>
      <span class="set">
        <label><input type="color" id="ink" value="#e3e9ef"></label>
      </span>
      <span class="set" id="verbs">
        <button data-verb="walk">walk</button>
        <button data-verb="run">run</button>
        <button data-verb="jump">jump</button>
        <button data-verb="spin">spin</button>
        <button data-verb="bob">bob</button>
        <button data-verb="pulse">pulse</button>
        <button data-verb="none">none</button>
      </span>
      <span class="set">
        <button data-do="Step" data-forwards="false" title="previous key">|&lt;</button>
        <button data-do="Key">key</button>
        <button data-do="Step" data-forwards="true" title="next key">&gt;|</button>
        <button data-do="Unkey">unkey</button>
      </span>
      <span class="set">
        <button id="play">play</button>
        <button data-do="Rewind">rewind</button>
      </span>
      <span class="set">
        <button data-do="Group">group</button>
        <button data-do="Ungroup">split</button>
      </span>
      <span class="set">
        <button data-do="Undo">undo</button>
        <button data-do="Redo">redo</button>
        <button data-do="Smooth">even out</button>
      </span>
      <span class="set">
        <button data-do="Save">save</button>
        <button data-do="Open">open</button>
        <button data-do="Clear">clear</button>
      </span>
      <span class="set">
        <button id="full" title="just the drawing">&#x2922;</button>
        <a class="asbutton" href="/" title="all the drawings">home</a>
      </span>
    </div>

    <!-- The players' bar. IN NORMAL FLOW, above the canvas, so it cannot
         overlap the board -- it used to float over it, and on a small window
         it sat on the squares. The canvas takes what is left, and the drawing
         is fitted to that, so the board simply gets smaller instead.

         Outside `#bar` as well, because the game view hides that and these are
         needed most exactly there. -->
    <div id="hud" hidden>
      <div id="seats"></div>
      <label id="who"><span>you are</span><input id="myname" maxlength="16" placeholder="your name" autocomplete="off"></label>
      <!-- One sentence that is always true about the game. It used to come
           from three places that disagreed, which is most of why the controls
           seemed to move about. -->
      <span id="state" hidden></span>
      <span id="hud-gap"></span>
      <label id="vol" hidden><span>volume</span><input id="volume" type="range" min="0" max="150" value="100"></label>
      <button id="speaker" hidden title="play through the loudspeaker">&#x1F50A;</button>
      <span id="room" hidden><span id="room-code"></span><button id="room-copy">copy link</button></span>
      <button id="mic" title="talk to the others">&#x1F3A4; talk</button>
    </div>

    <!-- Who is in the room, with a level bar each. So two tabs on one machine
         can be tested without headphones: you can SEE the other one hearing
         you, which listening cannot tell you anyway -- a stream arriving into
         a muted element sounds exactly like no stream at all. -->
    <div id="voices" hidden></div>

    <canvas id="paper"></canvas>

    <!-- Before the game starts: the house rules the drawing declares for
         itself. Built from `rules` on the wire, so nothing here knows what
         Ludo is -- any game gets this by writing `# rule: ...` on a row. -->
    <!-- The lobby. Everything that happens before a game starts: who has
         arrived, what to call yourself, turning your microphone on, and the
         rules you will all be playing by.

         It is one screen rather than a step-by-step because there is no order
         to any of it -- somebody can name themselves after they sit down, or
         talk before they do. -->
    <div id="setup" hidden>
      <div class="sheet">
        <h2 id="lobby-title">waiting for the others</h2>
        <p id="lobby-note">send them the link &mdash; they will appear here</p>

        <div class="lobby-row">
          <label id="lobby-who"><span>you are</span>
            <input id="lobby-name" maxlength="16" placeholder="your name" autocomplete="off">
          </label>
          <button id="lobby-mic" title="talk to the others">&#x1F3A4; talk</button>
        </div>

        <h3>in the room</h3>
        <div id="lobby-list"></div>
        <!-- What the reader should do about their own sound. Somebody who
             cannot be heard should learn it from their own screen rather than
             from the others noticing. -->
        <p id="lobby-sound" class="sound-note" hidden></p>

        <h3>the game</h3>
        <div id="lobby-games"></div>

        <h3>players</h3>
        <label class="opt"><input type="checkbox" id="bots-on" checked>
          <span>fill the empty seats with bots<em>off means just the people here</em></span>
        </label>

        <h3>house rules</h3>
        <div id="rules"></div>

        <button id="begin">start the game</button>
      </div>
    </div>
    <div id="hint">drag to draw &middot; tap to choose &middot; shift-drag or middle-drag moves the paper &middot; wheel zooms</div>
  </main>
</div>

<script src="/app.js"></script>
