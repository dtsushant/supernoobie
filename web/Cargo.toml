[package]
name = "web"
version = "0.1.0"
edition = "2021"
description = "The studio in a browser: the drawing stays in Rust, the interface is the DOM."

# All pure Rust. The whole workspace still links no C library, and this needs
# no wasm toolchain either -- which is the reason for a server rather than
# WebAssembly.
[dependencies]
easel = { path = "../easel" }
plotkit = { path = "../plotkit" }
shapes = { path = "../shapes" }

axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Who holds the controls. Its own crate because the next game will want more
# than "one of you is in charge", and that is more deeds rather than a rewrite.
auth = { path = "../auth" }
