[package]
name = "recursion1"
version = "0.3.0"
edition = "2021"
description = "Pulley system on the complex plane - geometry, dynamics, a software rasteriser and a live HTMX console"

# The mathematics core (complex / pulley / dynamics / raster) has NO
# dependencies and never will. Everything below is optional and feature-gated,
# so `cargo test` always runs against pure std.
[dependencies]
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"], optional = true }
minifb = { version = "0.28", optional = true }

[features]
# live browser console, rendered server-side
serve = ["dep:axum", "dep:tokio"]
# interactive windows, every pixel drawn on the CPU
window = ["dep:minifb"]

[lib]
name = "recursion1"
path = "src/lib.rs"

[[bin]]
name = "recursion1"
path = "src/main.rs"

[[bin]]
name = "serve"
path = "src/bin/serve.rs"
required-features = ["serve"]

[[bin]]
name = "play"
path = "src/bin/play.rs"
required-features = ["window"]

[[bin]]
name = "bodies"
path = "src/bin/bodies.rs"
required-features = ["window"]

[[bin]]
name = "cloth"
path = "src/bin/cloth.rs"
required-features = ["window"]

[[bin]]
name = "fluid"
path = "src/bin/fluid.rs"
required-features = ["window"]

[profile.release]
opt-level = 3
